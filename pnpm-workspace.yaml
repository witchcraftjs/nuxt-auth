packages:
  - ./
  - playground/

allowBuilds:
  '@alanscodelog/eslint-config': false
  '@alanscodelog/tsconfigs': false
  '@parcel/watcher': false
  '@swc/core': false
  electron: true
  esbuild: true
  unrs-resolver: false
  vue-demi: false

allowUnusedPatches: true

catalog:
  '@alanscodelog/eslint-config': ^6.3.1
  '@alanscodelog/semantic-release-config': ^6.0.2
  '@alanscodelog/tsconfigs': ^6.3.0
  '@alanscodelog/utils': ^6.3.1
  '@commitlint/cli': ^20.1.0
  '@iconify/json': ^2.2.393
  '@nuxt/eslint-config': ^1.9.0
  '@nuxt/kit': ^4.1.3
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/schema': ^4.1.3
  '@nuxt/test-utils': ^4.0.3
  '@oslojs/crypto': ^1.0.1
  '@oslojs/encoding': ^1.1.0
  '@standard-schema/spec': ^1.1.0
  'better-auth': ^1.7.13
  '@better-auth/electron': ^1.7.13
  '@tailwindcss/cli': ^4.1.14
  '@types/jsonwebtoken': ^9.0.10
  '@vueuse/core': ^13.9.0
  '@witchcraft/nuxt-electron': ^0.4.4
  '@witchcraft/nuxt-logger': ^0.1.3
  '@witchcraft/nuxt-postgres': ^0.4.6
  '@witchcraft/nuxt-utils': ^0.3.13
  '@witchcraft/ui': ^0.5.15
  arctic: ^3.7.0
  changelogen: ^0.6.2
  conf: ^15.0.2
  concurrently: ^9.2.1
  cookie-es: ^3.1.1
  cross-env: ^10.1.0
  defu: ^6.1.4
  drizzle-kit: ^0.31.4
  drizzle-orm: ^0.45.2
  drizzle-zod: ^0.8.3
  electron: ^38.2.2
  eslint: ^9.37.0
  h3: 1.15.11
  husky: ^9.1.7
  jsonwebtoken: ^9.0.2
  ms: ^3.0.0-canary.202508261828
  nuxt: 4.6.1
  nuxt-security: 2.7.0
  '@playwright/test': =1.65.0
  'playwright-core': =1.65.0
  pino: ^10.0.0
  pino-pretty: ^11.3.0
  thread-stream: ^3.1.0
  reka-ui: ^2.5.1
  semantic-release: ^25.0.3
  tailwindcss: ^4.1.14
  tsx: ^4.20.5
  typescript: ^5.9.3
  unimport: ^6.4.0
  unplugin-icons: ^23.0.1
  unplugin-vue-components: ^32.0.0
  vitest: ^4.1.7
  vue: ^3.5.0
  vue-tsc: ^3.3.3
  zod: ^4.6.6

patchedDependencies:
  '@nuxt/module-builder': patches/@nuxt__module-builder.patch

settings:
  catalogMode: strict
  cleanupUnusedCatalogs: false

overrides:
  "unplugin-icons>vue": "*"
  # force the @visulima/package version that declares the missing @visulima/yaml dep (visulima/visulima#931), safe to remove after 2026-10-28
  "@visulima/package": "5.0.43"
  # force the yauzl with the Node 24.16+/26.1+ unzip fix, electron's old extract-zip otherwise silently extracts nothing (electron/electron#51619)
  "yauzl": "^3.3.1"

publicHoistPattern:
  - '*vue*'

strictPeerDependencies: false
minimumReleaseAge: 20160
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  - "@alanscodelog/*"
  - "@playwright/test"
  - "playwright"
  - "playwright-core"
  - "@witchcraft/*"
  - "@better-auth/*"
  - "better-auth"
  - "better-call"
  - "better-fetch"
  - "@better-fetch/*"
  - "@better-auth/utils"
  - 'metamorphosis'
  # exempt @visulima/* from the age check so the override above can install the fixed versions immediately, safe to remove after 2026-10-28
  - '@visulima/*'
  - '@typescript-eslint/eslint-plugin@8.60.1'
  - '@typescript-eslint/parser@8.60.1'
  - '@typescript-eslint/project-service@8.60.1'
  - '@typescript-eslint/scope-manager@8.60.1'
  - '@typescript-eslint/tsconfig-utils@8.60.1'
  - '@typescript-eslint/type-utils@8.60.1'
  - '@typescript-eslint/types@8.60.1'
  - '@typescript-eslint/typescript-estree@8.60.1'
  - '@typescript-eslint/utils@8.60.1'
  - '@typescript-eslint/visitor-keys@8.60.1'
  - '@vue/language-core@3.3.3'
  - vue-tsc@3.3.3
  # security fixes younger than the 14 day quarantine; remove after 2026-11-08
  - nuxt-security@2.7.0
